{% extends "base.html" %}
{% block title %}Reset password · leavi{% endblock %}
{% block body %}
    <div class="min-h-screen flex flex-col items-center justify-center bg-bg px-4 py-12">
        <div class="w-full max-w-md">
            <div class="rounded-drawer bg-surface p-10 shadow-popover">
                <div class="flex flex-col items-center gap-3 mb-7">
                    <div class="flex h-10 w-10 items-center justify-center rounded-[10px] bg-accent text-white">
                        <svg class="h-5.5 w-5.5"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor"
                             stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 14l2 2 4-4" />
                        </svg>
                    </div>
                    <span class="text-base font-semibold">leavi</span>
                </div>
                <h1 class="font-serif text-[28px] font-semibold tracking-tight text-center mb-1.5">Reset password</h1>
                <p class="text-sm text-text-muted text-center mb-7">
                    Enter the email associated with your account and we’ll send you a reset link.
                </p>
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div>
                        <label class="block text-[13px] font-medium mb-1.5">Email</label>
                        <input type="email"
                               name="email"
                               required
                               class="w-full h-10 rounded-control border border-border-strong bg-surface px-3 text-sm"
                               placeholder="amara@operations.co">
                    </div>
                    <button type="submit"
                            class="mt-2 w-full h-11 rounded-control bg-accent text-white text-sm font-medium hover:bg-accent-hover">
                        Send reset link
                    </button>
                </form>
                <p class="mt-6 text-center text-[13px] text-text-muted">
                    <a href="{% url 'accounts:login' %}"
                       class="text-accent-hover hover:underline">Back to sign in</a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
