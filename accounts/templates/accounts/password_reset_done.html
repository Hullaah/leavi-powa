{% extends "base.html" %}
{% block title %}Check your email · leavi{% endblock %}
{% block body %}
    <div class="min-h-screen flex flex-col items-center justify-center bg-bg px-4 py-12">
        <div class="w-full max-w-md text-center">
            <div class="rounded-drawer bg-surface p-10 shadow-popover">
                <h1 class="font-serif text-[28px] font-semibold tracking-tight mb-3">Check your email</h1>
                <p class="text-text-muted mb-6">If an account exists with that email, we’ve sent a password reset link.</p>
                <a href="{% url 'accounts:login' %}"
                   class="inline-flex h-11 items-center justify-center rounded-control bg-accent px-6 text-sm font-medium text-white hover:bg-accent-hover">
                    Back to sign in
                </a>
            </div>
        </div>
    </div>
{% endblock %}
